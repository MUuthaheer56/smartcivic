{% extends "base.html" %}

{% block content %}
<style>
    .auth-container {
        max-width: 480px;
        margin: 3.5rem auto;
        padding: 2.75rem 2.25rem;
        background: var(--sc-card);
        border: 1px solid var(--sc-card-border);
        border-top: 4px solid var(--royal-gold-500, #c9a227);
        border-radius: var(--radius-xl, 20px);
        box-shadow: var(--shadow-xl);
        position: relative;
    }

    .auth-kicker {
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--royal-gold-600);
        text-align: center;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
    }

    html.dark .auth-kicker {
        color: var(--royal-gold-400);
    }

    .auth-title {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 0.35rem;
        text-align: center;
        color: var(--sc-text);
        letter-spacing: -0.02em;
    }

    .auth-subtitle {
        color: var(--sc-muted);
        text-align: center;
        margin-bottom: 2rem;
        font-size: 0.95rem;
        line-height: 1.45;
    }

    .auth-footer {
        margin-top: 1.75rem;
        text-align: center;
        font-size: 0.92rem;
        color: var(--sc-muted);
    }

    .auth-footer a {
        color: var(--royal-gold-600);
        text-decoration: none;
        font-weight: 700;
    }

    html.dark .auth-footer a {
        color: var(--royal-gold-400);
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>
<section class="auth-shell">
    <div class="glass-panel auth-container">
        <div class="auth-kicker"><i class="fa-solid fa-shield-halved"></i> SECURE CIVIC ACCESS</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to report issues, follow jurisdictional triage, or dispatch municipal
            personnel.</p>

        <form id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="email">Email address</label>
                <input type="email" id="email" class="form-control" placeholder="citizen@smartcivic.local"
                    autocomplete="email" required>
            </div>
            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="password">Password</label>
                </div>
                <div class="password-field">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password"
                        autocomplete="current-password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"
                        title="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary auth-submit" id="loginSubmit" style="width: 100%;"><i
                    class="fa-solid fa-arrow-right-to-bracket" style="color: var(--accent-gold);"></i> Sign in</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Create one</a>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    passwordToggle.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        passwordToggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        passwordToggle.title = isPassword ? 'Hide password' : 'Show password';
        passwordToggle.innerHTML = `<i class="fa-solid fa-eye${isPassword ? '-slash' : ''}"></i>`;
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitButton = document.getElementById('loginSubmit');
        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;
        submitButton.disabled = true;
        submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in';

        try {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
            const headers = { 'Content-Type': 'application/json' };
            if (csrfToken) {
                headers['X-CSRFToken'] = csrfToken;
            }
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ email, password })
            });
            const data = await res.json().catch(() => ({}));

            if (data.success) {
                showToast("Login successful!", "success");
                const role = data.data.user.role;
                const redirectTarget = data.redirect || (data.data && data.data.redirect);
                setTimeout(() => {
                    if (role === 'admin') window.location.href = redirectTarget || '/admin/dashboard';
                    else if (role === 'citizen') window.location.href = redirectTarget || '/citizen/dashboard';
                    else if (role === 'officer') window.location.href = redirectTarget || '/officer/dashboard';
                    else if (role === 'worker') window.location.href = redirectTarget || '/worker/dashboard';
                    else if (redirectTarget) window.location.href = redirectTarget;
                }, 1000);
            } else {
                showToast(data.error.message || "Login failed.", "danger");
            }
        } catch (err) {
            showToast("Server communication error.", "danger");
        } finally {
            submitButton.disabled = false;
            submitButton.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket" style="color: var(--accent-gold);"></i> Sign in';
        }
    });
</script>
{% endblock %}
