{% extends "base.html" %}

{% block content %}
<style>
    .auth-container {
        max-width: 520px;
        margin: 2.5rem auto;
        padding: 2.75rem 2.25rem;
        background: var(--sc-card);
        border: 1px solid var(--sc-card-border);
        border-top: 4px solid var(--royal-gold-500, #c9a227);
        border-radius: var(--radius-xl, 20px);
        box-shadow: var(--shadow-xl);
    }

    .auth-title {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 2rem;
        margin-bottom: 0.35rem;
        text-align: center;
        color: var(--sc-text);
    }

    .auth-subtitle {
        color: var(--sc-muted);
        text-align: center;
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }

    .form-group {
        margin-bottom: 1.35rem;
    }

    .auth-footer {
        margin-top: 1.75rem;
        text-align: center;
        font-size: 0.92rem;
        color: var(--sc-muted);
    }

    .auth-footer a {
        color: var(--royal-gold-600);
        text-decoration: none;
        font-weight: 700;
    }

    html.dark .auth-footer a {
        color: var(--royal-gold-400);
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    #skillsGroup {
        display: none;
    }
</style>

<div class="auth-container">
    <div
        style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--royal-gold-600); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.75rem;">
        <i class="fa-solid fa-building-shield"></i> Municipal Citizen Register
    </div>
    <h2 class="auth-title">Join SmartCivic+</h2>
    <p class="auth-subtitle">Create your verified resident or municipal personnel profile</p>

    <form id="registerForm" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters"
                required>
        </div>
        <div class="form-group">
            <label class="form-label" for="role">Role</label>
            <select id="role" name="role" class="form-control" onchange="toggleSkills()" required>
                <option value="citizen">Citizen (Resident)</option>
                <option value="officer">Officer (Administrator)</option>
                <option value="worker">Worker (Field Crew)</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="ward">Ward / Zone Area</label>
            <input type="text" id="ward" name="ward" class="form-control" placeholder="Ward 1, TC Palya, etc." required>
        </div>
        <div class="form-group" id="docGroup">
            <label class="form-label" for="verification_doc">Verification Document (ID / Utility Bill - JPG, PNG, PDF)</label>
            <input type="file" id="verification_doc" name="verification_doc" class="form-control"
                accept=".jpg,.jpeg,.png,.pdf" required>
        </div>
        <div class="form-group" id="inviteCodeGroup" style="display: none;">
            <label class="form-label" for="inviteCode">Admin Invite Code (Required for Officers / Workers)</label>
            <input type="text" id="inviteCode" name="invite_code" class="form-control"
                placeholder="Enter the configured staff invite code" autocomplete="off">
        </div>
        <div class="form-group" id="skillsGroup" style="display: none;">
            <label class="form-label" for="skills">Skills (comma-separated list)</label>
            <input type="text" id="skills" name="skills" class="form-control"
                placeholder="road_repair, electrical, sanitation, drainage">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;"><i
                class="fa-solid fa-user-plus"></i> Register</button>
    </form>

    <div class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleSkills() {
        const role = document.getElementById('role').value;
        const skillsGroup = document.getElementById('skillsGroup');
        const inviteCodeGroup = document.getElementById('inviteCodeGroup');
        const docGroup = document.getElementById('docGroup');

        if (role === 'worker') {
            skillsGroup.style.display = 'block';
            inviteCodeGroup.style.display = 'block';
            if (docGroup) docGroup.style.display = 'none';
        } else if (role === 'officer') {
            skillsGroup.style.display = 'none';
            inviteCodeGroup.style.display = 'block';
            if (docGroup) docGroup.style.display = 'none';
        } else {
            skillsGroup.style.display = 'none';
            inviteCodeGroup.style.display = 'none';
            if (docGroup) docGroup.style.display = 'block';
        }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = document.getElementById('registerForm');
        const formData = new FormData(form);
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;

        const headers = {};
        if (csrfToken) {
            headers['X-CSRFToken'] = csrfToken;
        }

        try {
            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: headers,
                body: formData
            });
            const data = await res.json();

            if (data.success) {
                showToast("Registration successful! Pending verification.", "success");
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                const msg = (data.error && data.error.message) ? data.error.message : "Registration failed.";
                showToast(msg, "danger");
            }
        } catch (err) {
            showToast("Server communication error.", "danger");
        }
    });
</script>

{% endblock %}
