{% extends "base.html" %}
{% block title %}Report Civic Issue — SmartCivic{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px; margin-top: 2rem;">
    <h2>Report Civic Issue</h2>
    <form id="reportForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Issue Title</label>
            <input type="text" id="title" name="title" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required>
                <option value="road">Pothole / Road Damage</option>
                <option value="water">Water Supply</option>
                <option value="electricity">Streetlight / Electricity</option>
                <option value="sanitation">Garbage / Dump</option>
                <option value="drainage">Sewage / Drainage</option>
                <option value="noise">Noise Pollution</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="type">Issue Type</label>
            <input type="text" id="type" name="type" class="form-control" placeholder="e.g. pothole" required>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="ward">Ward</label>
            <input type="text" id="ward" name="ward" class="form-control" required>
        </div>
        <input type="hidden" id="lat" name="lat" value="12.9716">
        <input type="hidden" id="lng" name="lng" value="77.5946">
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Submit Issue</button>
    </form>
</div>
{% endblock %}
