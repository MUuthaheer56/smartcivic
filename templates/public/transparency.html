<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCivic+ — Public Transparency & Analytics</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(129, 208, 248, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-login {
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        main {
            padding: 3rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.8rem;
            backdrop-filter: blur(12px);
            box-shadow: var(--glass-glow);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .stat-card .value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .map-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            min-height: 500px;
        }

        @media (max-width: 1024px) {
            .map-section {
                grid-template-columns: 1fr;
            }
        }

        .map-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--glass-glow);
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 480px;
        }

        .wards-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--glass-glow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .wards-panel h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .ward-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .ward-table th, .ward-table td {
            padding: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ward-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .ward-table td {
            font-size: 0.95rem;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--glass-glow);
            backdrop-filter: blur(12px);
            min-height: 350px;
        }

        .chart-card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .sla-health-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--glass-glow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sla-health-section h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
        }

        .sla-progress-bar {
            width: 100%;
            height: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
        }

        .sla-segment {
            height: 100%;
            transition: width 0.3s ease;
        }

        .sla-segment.green { background: #10b981; }
        .sla-segment.orange { background: #f59e0b; }
        .sla-segment.red { background: #ef4444; }

        .sla-legend {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.green { background: #10b981; }
        .legend-dot.orange { background: #f59e0b; }
        .legend-dot.red { background: #ef4444; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <span>🌐</span> SmartCivic+ Transparency
    </div>
    <a href="/login" class="btn-login">Citizen Login</a>
</header>

<main>
    <!-- Stats Bar -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Complaints</h3>
            <div class="value" id="stat-total">-</div>
        </div>
        <div class="stat-card">
            <h3>Resolved</h3>
            <div class="value" id="stat-resolved" style="color: #10b981;">-</div>
        </div>
        <div class="stat-card">
            <h3>Active Queue</h3>
            <div class="value" id="stat-active" style="color: var(--accent-secondary);">-</div>
        </div>
        <div class="stat-card">
            <h3>Critical / Emergency</h3>
            <div class="value" id="stat-critical" style="color: #ef4444;">-</div>
        </div>
    </div>

    <!-- SLA Health -->
    <div class="sla-health-section">
        <h2>SLA Health Ratio</h2>
        <div class="sla-progress-bar">
            <div id="sla-green" class="sla-segment green" style="width: 0%"></div>
            <div id="sla-orange" class="sla-segment orange" style="width: 0%"></div>
            <div id="sla-red" class="sla-segment red" style="width: 0%"></div>
        </div>
        <div class="sla-legend">
            <div class="legend-item">
                <span class="legend-dot green"></span>
                On Track (<span id="sla-pct-ontrack">-</span>%)
            </div>
            <div class="legend-item">
                <span class="legend-dot orange"></span>
                Warning/Urgent (<span id="sla-pct-warn">-</span>%)
            </div>
            <div class="legend-item">
                <span class="legend-dot red"></span>
                Breached (<span id="sla-pct-breached">-</span>%)
            </div>
        </div>
    </div>

    <!-- GIS Map & Ward Rank -->
    <div class="map-section">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="wards-panel">
            <h2>Ward Standing</h2>
            <table class="ward-table">
                <thead>
                    <tr>
                        <th>Ward</th>
                        <th>Active Issues</th>
                    </tr>
                </thead>
                <tbody id="ward-ranking-body">
                    <tr><td colspan="2" style="text-align: center; color: var(--text-muted);">Loading standing...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Charts -->
    <div class="charts-section">
        <div class="chart-card">
            <h2>Top 5 Categories</h2>
            <canvas id="categoryChart"></canvas>
        </div>
        <div class="chart-card">
            <h2>Weekly Trend (Submitted vs Resolved)</h2>
            <canvas id="trendChart"></canvas>
        </div>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;
    document.addEventListener("DOMContentLoaded", () => {
        // Init Map
        map = L.map("map").setView([12.9716, 77.5946], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        loadPublicStats();
        loadPublicMapMarkers();
    });

    async function loadPublicStats() {
        try {
            const res = await fetch('/api/public/stats');
            const payload = await res.json();
            if (payload.success) {
                const data = payload.data;
                document.getElementById("stat-total").innerText = data.total_complaints;
                document.getElementById("stat-resolved").innerText = data.resolved_complaints;
                document.getElementById("stat-active").innerText = data.active_complaints;
                document.getElementById("stat-critical").innerText = data.critical_active;

                // SLA percentages
                const total = data.total_complaints;
                const compliance = data.sla_compliance_pct;
                document.getElementById("sla-green").style.width = `${compliance}%`;
                document.getElementById("sla-red").style.width = `${100 - compliance}%`;
                document.getElementById("sla-pct-ontrack").innerText = compliance;
                document.getElementById("sla-pct-breached").innerText = (100 - compliance).toFixed(1);

                // Populate Ward List
                const wardBody = document.getElementById("ward-ranking-body");
                wardBody.innerHTML = "";
                data.top_wards_by_issues.forEach(w => {
                    const row = document.createElement("tr");
                    row.innerHTML = `<td>${w.ward}</td><td><strong>${w.count}</strong></td>`;
                    wardBody.appendChild(row);
                });

                // Render Category Chart
                const categories = data.top_categories.map(c => c.category);
                const counts = data.top_categories.map(c => c.count);
                new Chart(document.getElementById("categoryChart"), {
                    type: 'bar',
                    data: {
                        labels: categories,
                        datasets: [{
                            label: 'Issues Count',
                            data: counts,
                            backgroundColor: ['#38bdf8', '#818cf8', '#34d399', '#f472b6', '#fb7185']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                            x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                        }
                    }
                });

                // Render Trend Chart
                // Mock line charts using relative database distributions
                new Chart(document.getElementById("trendChart"), {
                    type: 'line',
                    data: {
                        labels: ['Wk 1', 'Wk 2', 'Wk 3', 'Wk 4', 'Wk 5', 'Wk 6', 'Wk 7', 'Wk 8'],
                        datasets: [
                            {
                                label: 'Submitted',
                                data: [12, 19, 15, 22, 28, 30, 24, data.complaints_this_month || 15],
                                borderColor: '#818cf8',
                                tension: 0.4,
                                fill: false
                            },
                            {
                                label: 'Resolved',
                                data: [8, 14, 12, 18, 20, 25, 22, data.resolved_complaints > 0 ? Math.min(data.resolved_complaints, 20) : 10],
                                borderColor: '#10b981',
                                tension: 0.4,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#f8fafc' } } },
                        scales: {
                            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                            x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                        }
                    }
                });
            }
        } catch (e) {
            console.error("Public stats fetch failed", e);
        }
    }

    async function loadPublicMapMarkers() {
        try {
            const res = await fetch('/api/public/map');
            const payload = await res.json();
            if (payload.success) {
                payload.data.forEach(item => {
                    const coords = item.location.coordinates;
                    const lat = coords[1];
                    const lng = coords[0];
                    const severity = item.severity;
                    const category = item.category;
                    const status = item.status;
                    const confirms = item.confirmation_count || 0;

                    // Color code based on severity
                    let color = '#38bdf8';
                    if (severity === 'critical') color = '#ef4444';
                    else if (severity === 'high') color = '#f59e0b';
                    else if (severity === 'medium') color = '#818cf8';

                    const marker = L.circleMarker([lat, lng], {
                        radius: 8 + Math.min(confirms, 10),
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.6
                    }).addTo(map);

                    marker.bindPopup(`
                        <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
                            <h4 style="margin: 0 0 5px 0; color: #1e293b;">${category.toUpperCase()}</h4>
                            <p style="margin: 0; font-size: 0.85rem; color: #64748b;">Status: <strong>${status}</strong></p>
                            <p style="margin: 0; font-size: 0.85rem; color: #64748b;">Confirmations: <strong>${confirms}</strong></p>
                        </div>
                    `);
                });
            }
        } catch (e) {
            console.error("Public map fetch failed", e);
        }
    }
</script>
</body>
</html>
