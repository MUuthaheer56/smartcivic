{% extends 'base.html' %}

{% block content %}
<div style="max-width:420px; margin:40px auto;">
  <div class="card">
    <h2 style="text-align:center; margin-bottom:24px;">Login to SmartCivic</h2>
    
    <form id="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:10px;">Login</button>
    </form>
    
    <div style="text-align:center; margin-top:20px; font-size:0.9rem;">
      Don't have an account? <a href="/register" style="color:var(--primary); font-weight:500;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // If logged in, redirect
    if (Auth.isLoggedIn()) {
      window.location.href = '/community';
      return;
    }
    
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const res = await apiFetch('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      
      if (res?.success) {
        Auth.setSession(res.data.token, res.data.user);
        showToast("Login successful!", "success");
        
        // Redirect based on role
        const role = res.data.user.role;
        if (role === 'authority') {
          window.location.href = '/authority';
        } else if (role === 'field_worker') {
          window.location.href = '/worker';
        } else {
          window.location.href = '/community';
        }
      } else if (res) {
        showToast(res.message, "error");
      }
    });
  });
</script>
{% endblock %}
