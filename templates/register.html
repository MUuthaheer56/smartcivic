{% extends 'base.html' %}

{% block content %}
<div style="max-width:480px; margin:40px auto;">
  <div class="card">
    <h2 style="text-align:center; margin-bottom:24px;">Register for SmartCivic</h2>
    
    <form id="register-form" enctype="multipart/form-data">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Enter full name" required>
      </div>
      
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Enter email" required>
      </div>
      
      <div class="form-group">
        <label for="password" class="form-label">Password (min 6 characters)</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" minlength="6" required>
      </div>
      
      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
      </div>
      
      <div class="form-group">
        <label for="role" class="form-label">Role</label>
        <select id="role" name="role" class="form-control" required>
          <option value="resident">Resident</option>
          <option value="field_worker">Field Worker</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="community_id" class="form-label">Select Community</label>
        <select id="community_id" name="community_id" class="form-control" required>
          <option value="">Loading communities...</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="verification_doc" class="form-label">Upload Verification Document (ID / Address Proof)</label>
        <input type="file" id="verification_doc" name="verification_doc" class="form-control" accept="image/*,.pdf">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:10px;">Register</button>
    </form>
    
    <div style="text-align:center; margin-top:20px; font-size:0.9rem;">
      Already have an account? <a href="/login" style="color:var(--primary); font-weight:500;">Login here</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Load communities into dropdown
    const commSelect = document.getElementById('community_id');
    try {
      const res = await fetch('/api/communities/');
      const result = await res.json();
      if (result.success) {
        let options = '<option value="">-- Choose Community --</option>';
        result.data.forEach(c => {
          options += `<option value="${c._id}">${c.name} (${c.city}, ${c.state})</option>`;
        });
        commSelect.innerHTML = options;
      }
    } catch(e) {
      console.error(e);
      commSelect.innerHTML = '<option value="">Failed to load communities</option>';
    }
    
    const form = document.getElementById('register-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pwd = document.getElementById('password').value;
      const pwd2 = document.getElementById('confirm_password').value;
      if (pwd !== pwd2) {
        showToast("Passwords do not match!", "error");
        return;
      }
      
      const formData = new FormData(form);
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          body: formData
        });
        const result = await res.json();
        
        if (result.success) {
          showToast(result.message, "success");
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        } else {
          showToast(result.message, "error");
        }
      } catch(err) {
        showToast("Registration failed. Please check connection.", "error");
      }
    });
  });
</script>
{% endblock %}
