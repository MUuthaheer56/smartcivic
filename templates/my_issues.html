{% extends 'base.html' %}

{% block content %}
<div class="grid">
  <!-- Reported Issues List -->
  <div class="col-8">
    <div class="card" style="margin-bottom:20px;">
      <h2>My Reported Issues</h2>
      <p style="color:var(--neutral-600); font-size:0.9rem; margin-top:4px;">Manage and monitor resolution progress for the issues you reported.</p>
    </div>
    
    <div id="my-issues-list" style="display:flex; flex-direction:column; gap:16px;">
      <!-- Loaded dynamically -->
    </div>
  </div>
  
  <!-- Notifications Panel -->
  <div class="col-4" id="notifications-panel">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3>My Notifications</h3>
        <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.8rem;" onclick="markAllNotificationsRead()">Mark All Read</button>
      </div>
      
      <div id="notifications-list" style="display:flex; flex-direction:column; gap:12px; max-height:500px; overflow-y:auto; padding-right:6px;">
        <!-- Loaded dynamically -->
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (!Auth.isLoggedIn()) {
      showToast("Please log in to manage your issues", "warning");
      window.location.href = '/login';
      return;
    }
    
    loadMyIssues();
    loadNotificationsList();
  });
  
  async function loadMyIssues() {
    const user = Auth.getUser();
    // Fetch all issues in user's community
    const res = await apiFetch(`/api/issues/?community_id=${user.community_id}&limit=100`);
    const container = document.getElementById('my-issues-list');
    if (!container) return;
    
    if (!res?.success) {
      container.innerHTML = `<div class="card" style="text-align:center; padding:20px; color:var(--neutral-600);">Failed to load issues.</div>`;
      return;
    }
    
    // Filter issues reported by current user
    const myIssues = res.data.issues.filter(iss => iss.reporter_id === user.user_id);
    
    if (myIssues.length === 0) {
      container.innerHTML = `
        <div class="card" style="text-align:center; padding:40px; color:var(--neutral-600);">
          <h3>No reported issues yet.</h3>
          <p style="margin-top:10px; margin-bottom:20px;">Help make your community better by reporting local civic issues.</p>
          <a href="/report" class="btn btn-primary">Report an Issue</a>
        </div>
      `;
      return;
    }
    
    let html = '';
    myIssues.forEach(iss => {
      html += `
        <div class="card" style="display:flex; justify-content:space-between; align-items:start;" onclick="window.location.href='/issues/${iss._id}'">
          <div>
            <span class="badge-cat cat-${iss.category}" style="margin-bottom:8px;">${iss.category}</span>
            <h3 style="font-size:1.15rem; margin-top:6px; margin-bottom:6px;">${iss.title}</h3>
            <p style="font-size:0.85rem; color:var(--neutral-600); margin-bottom:8px;">📍 Address: ${iss.address}</p>
            <span style="font-size:0.8rem; padding:2px 8px; border-radius:4px;" class="status-badge">${iss.status.replace('_', ' ').toUpperCase()}</span>
          </div>
          <span style="font-size:0.75rem; color:var(--neutral-400);">${timeAgo(iss.created_at)}</span>
        </div>
      `;
    });
    container.innerHTML = html;
  }
  
  async function loadNotificationsList() {
    const res = await apiFetch('/api/notifications/');
    const list = document.getElementById('notifications-list');
    if (!list) return;
    
    if (!res?.success || res.data.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--neutral-400); font-size:0.9rem;">No notifications.</div>`;
      return;
    }
    
    let html = '';
    res.data.forEach(n => {
      html += `
        <div style="padding:10px; border-radius:var(--radius-sm); border:1px solid ${n.is_read ? 'var(--neutral-100)' : 'var(--primary-light)'}; background:${n.is_read ? 'transparent' : 'rgba(37, 99, 235, 0.05)'}; font-size:0.85rem; position:relative; cursor:pointer;" onclick="readAndRedirect('${n._id}', '${n.issue_id}')">
          <p style="color:var(--neutral-900); font-weight:${n.is_read ? 'normal' : '600'}; padding-right:16px;">${n.message}</p>
          <span style="font-size:0.75rem; color:var(--neutral-400); display:block; margin-top:4px;">${timeAgo(n.created_at)}</span>
          ${!n.is_read ? `<button style="position:absolute; top:8px; right:8px; background:none; border:none; color:var(--primary); font-size:0.8rem; font-weight:bold; cursor:pointer;" onclick="event.stopPropagation(); markRead('${n._id}')">✓</button>` : ''}
        </div>
      `;
    });
    list.innerHTML = html;
  }
  
  async function markRead(notifId) {
    const res = await apiFetch(`/api/notifications/${notifId}/read`, { method: 'PUT' });
    if (res?.success) {
      loadNotificationsList();
      loadNotifCount();
    }
  }
  
  async function readAndRedirect(notifId, issueId) {
    await markRead(notifId);
    if (issueId && issueId !== 'None') {
      window.location.href = `/issues/${issueId}`;
    }
  }
  
  async function markAllNotificationsRead() {
    const res = await apiFetch('/api/notifications/');
    if (res?.success) {
      const unread = res.data.filter(n => !n.is_read);
      for (const n of unread) {
        await apiFetch(`/api/notifications/${n._id}/read`, { method: 'PUT' });
      }
      showToast("All notifications marked as read", "success");
      loadNotificationsList();
      loadNotifCount();
    }
  }
</script>
{% endblock %}
