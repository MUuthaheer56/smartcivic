{% extends "base.html" %}
{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; gap: 1rem;">
    <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--danger);"></i>
    <h2 style="color: var(--text-primary);">Something went wrong</h2>
    <p style="color: var(--text-muted);">{{ message }}</p>
    <a href="/" style="padding: 0.6rem 1.4rem; background: var(--primary); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600;">Go Home</a>
</div>
{% endblock %}
