{% extends "base.html" %}
{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; gap: 1rem;">
    <i class="fa-solid fa-compass" style="font-size: 3.5rem; color: var(--warning, #f59e0b);"></i>
    <h1 style="font-size: 2.2rem; font-family: var(--font-display);">404 — Page Not Found</h1>
    <p style="color: var(--text-muted); max-width: 450px;">The requested page could not be located. It may have been moved or deleted.</p>
    <a href="/" style="padding: 0.6rem 1.4rem; background: var(--primary); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 0.5rem;">Return to Command Center</a>
</div>
{% endblock %}
