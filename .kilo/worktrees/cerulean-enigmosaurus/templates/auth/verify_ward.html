{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto; padding: 2.5rem;" class="glass-panel">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 64px; height: 64px; background: rgba(34, 197, 94, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; border: 1px solid var(--primary);">
            <i class="fa-solid fa-building-shield" style="font-size: 1.8rem; color: var(--primary);"></i>
        </div>
        <h2 style="font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; margin-bottom: 0.5rem;">Verify Your Ward</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
            Please enter your ward area code to verify your account before submitting complaints.
        </p>
    </div>

    <div id="verifyAlert" style="display: none; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.85rem;"></div>

    <form id="verifyWardForm">
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">
                Ward Area Code
            </label>
            <input type="text" id="areaCodeInput" class="form-control" placeholder="e.g. KOR-017 or WARD101" required
                   style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase;">
            <small style="color: var(--text-muted); font-size: 0.75rem; display: block; margin-top: 0.35rem;">
                Ask your ward officer for your ward's official area code (e.g., KOR-017, JNR-015, TST-0000).
            </small>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 700; border-radius: 8px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <i class="fa-solid fa-circle-check"></i> Verify Ward & Continue
        </button>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('verifyWardForm');
    const alertBox = document.getElementById('verifyAlert');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const areaCode = document.getElementById('areaCodeInput').value.trim().toUpperCase();

        if (!areaCode) return;

        try {
            const token = sessionStorage.getItem('sc_access_token') || localStorage.getItem('sc_access_token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            };

            const res = await fetch('/api/auth/verify-ward', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ area_code: areaCode })
            });

            const data = await res.json();

            if (res.ok) {
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(34, 197, 94, 0.15)';
                alertBox.style.border = '1px solid var(--primary)';
                alertBox.style.color = '#22c55e';
                alertBox.textContent = `✓ Ward verified successfully! Assigned to ${data.ward_name || data.ward_id}. Redirecting...`;

                // Update local storage user state
                try {
                    const stored = JSON.parse(localStorage.getItem('sc_user') || '{}');
                    stored.verified = true;
                    stored.status = 'active';
                    stored.ward_id = data.ward_id;
                    localStorage.setItem('sc_user', JSON.stringify(stored));
                } catch {}

                setTimeout(() => {
                    window.location.href = '/citizen/dashboard';
                }, 1500);
            } else {
                alertBox.style.display = 'block';
                alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
                alertBox.style.border = '1px solid var(--danger)';
                alertBox.style.color = '#ef4444';
                alertBox.textContent = data.error || data.message || 'Invalid area code. Please check with your ward officer.';
            }
        } catch (err) {
            console.error(err);
            alertBox.style.display = 'block';
            alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
            alertBox.style.border = '1px solid var(--danger)';
            alertBox.style.color = '#ef4444';
            alertBox.textContent = 'Network error. Please try again.';
        }
    });
});
</script>
{% endblock %}
