{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
<div class="glass-panel auth-container">
    <div class="auth-kicker"><i class="fa-solid fa-shield-halved"></i> Secure civic access</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to report issues, follow progress, or manage your ward.</p>
    
    <form id="loginForm">
        <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
            <div class="form-label-row">
                <label class="form-label" for="password">Password</label>
            </div>
            <div class="password-field">
                <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" title="Show password"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="loginSubmit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in</button>
    </form>
    
    <div class="auth-footer">
        Don't have an account? <a href="/register">Create one</a>
    </div>
</div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    passwordToggle.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        passwordToggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        passwordToggle.title = isPassword ? 'Hide password' : 'Show password';
        passwordToggle.innerHTML = `<i class="fa-solid fa-eye${isPassword ? '-slash' : ''}"></i>`;
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitButton = document.getElementById('loginSubmit');
        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;
        submitButton.disabled = true;
        submitButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in';
        
        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json().catch(() => ({}));
            
            if (data.success) {
                showToast("Login successful!", "success");
                const role = data.data.user.role;
                setTimeout(() => {
                    if (role === 'citizen') window.location.href = '/citizen/dashboard';
                    else if (role === 'officer') window.location.href = '/officer/dashboard';
                    else if (role === 'worker') window.location.href = '/worker/dashboard';
                }, 1000);
            } else {
                showToast(data.error.message || "Login failed.", "danger");
            }
        } catch (err) {
            showToast("Server communication error.", "danger");
        } finally {
            submitButton.disabled = false;
            submitButton.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in';
        }
    });
</script>
{% endblock %}
