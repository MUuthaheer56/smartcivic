name: SmartCivic CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Syntax Linting & Compilation Check
        run: |
          python -m py_compile app.py run.py setup_indexes.py
          python -c "import ast, glob; [ast.parse(open(f, encoding='utf-8').read()) for f in glob.glob('**/*.py', recursive=True) if '.venv' not in f and '__pycache__' not in f]"

      - name: Run Pytest Suite
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smartcivic_ci
          JWT_SECRET: ci_test_jwt_secret_12345
          SECRET_KEY: ci_test_secret_key_67890
        run: |
          python setup_indexes.py
          pytest test_smartcivic.py -v --tb=short

      - name: Run Comprehensive QA Suite
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smartcivic_ci
        run: |
          python qa/run_all.py

      - name: Run Urban Knowledge Graph Integration Tests
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smartcivic_ci
        run: |
          python tests/test_graph_integration.py

      - name: Run End-to-End Verification Pipeline
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smartcivic_ci
        run: |
          python test_e2e_verification.py

      - name: Run UAT Full Lifecycle Walkthrough
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smartcivic_ci
        run: |
          python test_uat_walkthrough.py
