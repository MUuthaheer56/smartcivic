name: SmartCivic CI/CD Security & Test Pipeline

on:
  push:
    branches: [ main, master, develop, "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    name: Security Scans (Gitleaks, Pip-Audit, Bandit, Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit semgrep

      - name: Run Pip-Audit (Dependency Vulnerabilities)
        run: |
          pip-audit -r requirements.txt || true

      - name: Run Bandit (SAST AST Scan)
        run: |
          bandit -r . -x ./tests,./audit_tmp,./.venv,./ml/models -ll -ii || true

      - name: Run Semgrep (Security Rules)
        run: |
          semgrep --config "p/security-audit" --config "p/owasp-top-ten" --error || true

  test-and-verify:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/smartcivic_ci
      JWT_SECRET: ci_test_jwt_secret_1234567890_super_secure_phase4
      SECRET_KEY: ci_test_secret_key_0987654321_super_secure_phase4
      FERNET_ENCRYPTION_KEY: vK7s1L9Z9T4hU7q8R9a2X3b4C5d6E7f8G9h0I1j2K3w=
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Syntax Linting & Compilation Check
        run: |
          python -m py_compile app.py run.py setup_indexes.py
          python -c "import ast, glob; [ast.parse(open(f, encoding='utf-8').read()) for f in glob.glob('**/*.py', recursive=True) if '.venv' not in f and '__pycache__' not in f]"

      - name: Run Full Pytest Suite
        run: |
          python setup_indexes.py
          pytest -v --tb=short
