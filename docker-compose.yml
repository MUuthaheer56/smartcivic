version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smartcivic_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: smartcivic_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smartcivic
      - SECRET_KEY=replace_with_a_long_random_string
      - JWT_SECRET=replace_with_a_different_long_random_string
      - COOKIE_SECURE=false
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./static/uploads/issues:/app/static/uploads/issues

volumes:
  mongo_data:
