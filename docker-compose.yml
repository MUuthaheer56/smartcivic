version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: smartcivic_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=smartcivic
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: smartcivic_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smartcivic
      - SECRET_KEY=smartcivic_production_secret_key_change_me
      - JWT_SECRET=smartcivic_production_jwt_secret_change_me
      - COOKIE_SECURE=false
      - GUNICORN_WORKERS=1
      - GUNICORN_THREADS=32
      - GUNICORN_TIMEOUT=120
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./static/uploads/issues:/app/static/uploads/issues
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:
